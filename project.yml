name: Peek
options:
  bundleIdPrefix: com.udhayadithya
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    # The team that publishes the notarized releases. Not a secret: a team ID
    # is embedded in every signed binary and readable with `codesign -dv` on
    # any published build. Contributors signing locally should override it in
    # a personal xcconfig rather than changing it here — leaving it unset
    # makes the app ad-hoc signed, which silently breaks notarization.
    DEVELOPMENT_TEAM: 5ZN86R9K96
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Deliberately unsandboxed: cross-process Accessibility is required to read
    # the user's selection and no entitlement unlocks it under App Sandbox.
    # See docs/adr/0002 for the distribution consequences.
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PeekKit:
    path: Packages/PeekKit
  # The only third-party runtime dependency. Justified: Peek ships outside the
  # Mac App Store, so it needs its own updater, and a correct one means EdDSA
  # signature verification, atomic replacement of a running app, and privileged
  # installs. Sparkle is the audited standard for exactly this; hand-rolling it
  # would be security-sensitive work with no upside.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Peek:
    type: application
    platform: macOS
    sources:
      - path: App/Peek
    dependencies:
      - package: PeekKit
        product: PeekCore
      - package: PeekKit
        product: PeekProviders
      - package: PeekKit
        product: PeekSecurity
      - package: PeekKit
        product: PeekPersistence
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Peek
        PRODUCT_BUNDLE_IDENTIFIER: com.udhayadithya.Peek
        INFOPLIST_FILE: App/Peek/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Peek/Resources/Peek.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  PeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PeekTests
    dependencies:
      - target: Peek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.udhayadithya.PeekTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Peek.app/Contents/MacOS/Peek"
        SWIFT_OBJC_BRIDGING_HEADER: ""
