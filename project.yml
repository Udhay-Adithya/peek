name: Peek
options:
  bundleIdPrefix: com.udhayadithya
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5ZN86R9K96
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Deliberately unsandboxed: cross-process Accessibility is required to read
    # the user's selection and no entitlement unlocks it under App Sandbox.
    # See docs/adr/0002 for the distribution consequences.
    ENABLE_APP_SANDBOX: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PeekKit:
    path: Packages/PeekKit

targets:
  Peek:
    type: application
    platform: macOS
    sources:
      - path: App/Peek
    dependencies:
      - package: PeekKit
        product: PeekCore
    settings:
      base:
        PRODUCT_NAME: Peek
        PRODUCT_BUNDLE_IDENTIFIER: com.udhayadithya.Peek
        INFOPLIST_FILE: App/Peek/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Peek/Resources/Peek.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
